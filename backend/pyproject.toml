[project]
name = "veto"
version = "0.1.0"
description = "Verified Execution and Trusted Oversight for Autonomous AI Agents"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "jsonschema", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
connectors = ["cryptography>=42"]   # sealed connector secrets, DECISIONS D-030
postgres = ["psycopg[binary]>=3.1"]   # audit log on PostgreSQL (VETO_DB=postgresql://...), DECISIONS D-025
# Tier 2 (not used yet): scikit-learn for the Isolation Forest / n-gram anomaly models.
