# One-command demo:  docker compose up --build   ->  http://localhost:8000
# MVP note: the mock resource runs in-process behind an access key held only by the Execution Gateway.
# Network-level isolation (resource on a private Docker network) arrives with the first out-of-process adapter.
services:
  veto:
    build: .
    ports:
      - "8000:8000"
    environment:
      VETO_DEMO: "1"
      VETO_DB: "/data/audit.db"   # audit log persists across restarts; use ":memory:" for a throwaway demo
      # VETO_DB: "postgresql://veto_app:CHANGE_ME@postgres:5432/veto"   # audit on PostgreSQL, see docs/postgres.md
      VETO_AUTH_DB: "/data/auth.db"
      # VETO_MODE: "shadow"   # verdicts only, nothing enforced or executed (default: enforce)
      # DEMO-ONLY admin key so the dashboard can be signed in to. Override it (VETO_BOOTSTRAP_KEY=veto_...) for anything
      # beyond a local demo, and create real principals with scripts/veto_admin.py.
      # VETO_PLATFORM_KEY: "veto_..."   # platform administrator: creates and suspends tenants (/v1/platform/*)
      VETO_BOOTSTRAP_KEY: "${VETO_BOOTSTRAP_KEY:-veto_demo-only-key-change-me-0000}"
    volumes:
      - veto-data:/data
volumes:
  veto-data:
